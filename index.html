<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>御界 · 安全智能体</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f172a; color: #e2e8f0; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    background: #1e293b; padding: 16px 24px; border-bottom: 1px solid #334155;
    display: flex; align-items: center; gap: 12px;
  }
  header .logo { font-size: 22px; font-weight: 700; }
  header .sub { font-size: 13px; color: #94a3b8; }
  /* 模式切换栏 */
  .modebar {
    background: #1e293b; padding: 0 24px 14px; display: flex; gap: 10px;
    border-bottom: 1px solid #334155;
  }
  .modebar button {
    background: #0f172a; border: 1px solid #334155; color: #94a3b8;
    padding: 8px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
  }
  .modebar button.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .msg { max-width: 80%; padding: 14px 18px; border-radius: 14px; line-height: 1.6; }
  .msg.user {
    align-self: flex-end; background: #3b82f6; color: #fff;
    border-bottom-right-radius: 4px; white-space: pre-wrap; word-break: break-all;
  }
  .msg.bot {
    align-self: flex-start; background: #1e293b;
    border-bottom-left-radius: 4px; white-space: pre-wrap;
  }
  .steps {
    align-self: flex-start; max-width: 80%; font-size: 12px; color: #64748b;
    background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    padding: 10px 14px;
  }
  .steps .step { padding: 2px 0; }
  .steps .tool { color: #60a5fa; font-family: monospace; }
  footer {
    background: #1e293b; padding: 16px 24px; border-top: 1px solid #334155;
    display: flex; gap: 12px; align-items: center;
  }
  #input {
    flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px;
    padding: 12px 16px; color: #e2e8f0; font-size: 15px; outline: none;
    resize: none; font-family: inherit;
  }
  #input:focus { border-color: #3b82f6; }
  button {
    background: #3b82f6; color: #fff; border: none; border-radius: 10px;
    padding: 12px 20px; font-size: 15px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  #uploadBtn { background: #334155; }
  #uploadBtn:hover { background: #475569; }
  .loading { color: #94a3b8; font-style: italic; }
  /* 态势感知结果卡片里的“查看报告”按钮 */
  .report-btn {
    display: inline-block; margin-top: 10px; background: #10b981;
    padding: 8px 16px; border-radius: 8px; color: #fff; text-decoration: none;
    font-size: 14px;
  }
  .report-btn:hover { background: #059669; }
</style>
</head>
<body>
  <header>
    <span class="logo">🛡️ 御界 · 安全智能体</span>
    <span class="sub" id="subtitle">上传文件或输入密文,自主分析</span>
  </header>

  <!-- 模式切换栏 -->
  <div class="modebar">
    <button id="modeCtf" class="active" onclick="setMode('ctf')"> CTF 分析</button>
    <button id="modeAssess" onclick="setMode('assess')"> 态势感知</button>
  </div>

  <div id="chat">
    <div class="msg bot" id="welcome">你好!我是 CTF 分析助手。你可以:
- 直接输入密文/编码,我帮你识别和解码
- 上传文件(图片/二进制),我检测隐写和隐藏信息
- 描述题目,我给你分析思路</div>
  </div>

  <footer>
    <input type="file" id="fileInput" style="display:none">
    <button id="uploadBtn" onclick="document.getElementById('fileInput').click()">📎 上传</button>
    <textarea id="input" rows="1" placeholder="输入密文或问题,回车发送..."></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </footer>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const uploadBtn = document.getElementById('uploadBtn');
  const fileInput = document.getElementById('fileInput');
  const subtitle = document.getElementById('subtitle');

  let mode = 'ctf';   // 当前模式:ctf 或 assess

  // 切换模式:改按钮高亮、输入框提示、上传按钮可用性
  function setMode(m) {
    mode = m;
    document.getElementById('modeCtf').classList.toggle('active', m === 'ctf');
    document.getElementById('modeAssess').classList.toggle('active', m === 'assess');
    if (m === 'ctf') {
      subtitle.textContent = '上传文件或输入密文,自主分析';
      input.placeholder = '输入密文或问题,回车发送...';
      uploadBtn.style.display = '';   // CTF 模式显示上传
    } else {
      subtitle.textContent = '输入授权目标,自主完成态势评估';
      input.placeholder = '输入授权评估任务,例如:对127.0.0.1进行只读态势评估...';
      uploadBtn.style.display = 'none';  // 态势感知不需要上传
    }
  }

  function addMsg(text, cls) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addSteps(steps) {
    if (!steps) return;
    const calls = steps.filter(s => s.type === 'tool_call');
    if (calls.length === 0) return;
    const div = document.createElement('div');
    div.className = 'steps';
    div.innerHTML = '<b>分析过程:</b><br>' + calls.map((s, i) =>
      `<div class="step">${i+1}. 调用 <span class="tool">${s.tool}</span></div>`
    ).join('');
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    addMsg(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    // 按模式走不同接口
    if (mode === 'assess') {
      await runAssess(text);
    } else {
      await runCtf(text);
    }
    sendBtn.disabled = false;
  }

  // ---------- CTF 分析(原逻辑) ----------
  async function runCtf(text) {
    const loading = addMsg('分析中...', 'bot');
    loading.classList.add('loading');
    try {
      const form = new FormData();
      form.append('text', text);
      const resp = await fetch('/analyze', { method: 'POST', body: form });
      const data = await resp.json();
      loading.remove();
      addSteps(data.steps);
      addMsg(data.final_answer || '(无结果)', 'bot');
    } catch (e) {
      loading.remove();
      addMsg('出错了: ' + e, 'bot');
    }
  }

  // ---------- 态势感知(新) ----------
  async function runAssess(text) {
    const loading = addMsg('态势评估进行中(约 1~3 分钟)...\n正在扫描资产 → 多轮研判 → 比对 NVD 漏洞库,请稍候。', 'bot');
    loading.classList.add('loading');
    try {
      const form = new FormData();
      form.append('text', text);
      const resp = await fetch('/assess', { method: 'POST', body: form });
      const data = await resp.json();
      loading.remove();

      if (!data.ok) {
        addMsg('⚠️ ' + (data.message || '评估未完成'), 'bot');
        return;
      }

      // 结果摘要
      const comps = (data.matched_components && data.matched_components.length)
        ? data.matched_components.join(', ') : '无';
      const summary =
        `✅ 态势评估完成\n` +
        `目标:${data.target}\n` +
        `闭环轮数:${data.total_rounds}\n` +
        `最高风险:${data.highest_risk}\n` +
        `匹配组件:${comps}`;
      const box = addMsg(summary, 'bot');

      // “查看完整报告”按钮
      const link = document.createElement('a');
      link.href = data.report_url;
      link.target = '_blank';
      link.className = 'report-btn';
      link.textContent = '📊 查看完整可视化报告';
      box.appendChild(document.createElement('br'));
      box.appendChild(link);
      chat.scrollTop = chat.scrollHeight;
    } catch (e) {
      loading.remove();
      addMsg('出错了: ' + e, 'bot');
    }
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    addMsg('📎 上传文件: ' + file.name, 'user');
    sendBtn.disabled = true;
    const loading = addMsg('分析文件中...', 'bot');
    loading.classList.add('loading');
    try {
      const form = new FormData();
      form.append('file', file);
      const resp = await fetch('/upload', { method: 'POST', body: form });
      const data = await resp.json();
      loading.remove();
      addSteps(data.steps);
      addMsg(data.final_answer || '(无结果)', 'bot');
    } catch (e) {
      loading.remove();
      addMsg('出错了: ' + e, 'bot');
    }
    sendBtn.disabled = false;
    fileInput.value = '';
  });
</script>
</body>
</html>
